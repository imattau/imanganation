# Multi-character regional conditioning nodes live in custom node packs,
# not model files: ComfyUI_IPAdapter_plus, ComfyUI-ppm (Attention Couple).

# Image upscalers for the Phase 6a hi-res fix (docs/phase6a.md). `id` is the
# filename ComfyUI expects under models/upscale_models/.
upscalers:
  realesrgan:
    id: RealESRGAN_x4plus_anime_6B.pth
    display: Real-ESRGAN x4plus anime (6B) — fast detail-preserving upscale
    source: https://github.com/xinntao/Real-ESRGAN (release v0.2.2.4)
    subdir: upscale_models
    feature: hi-res upscale (Refine)
    license: {name: BSD-3-Clause, url: https://github.com/xinntao/Real-ESRGAN/blob/master/LICENSE}
    download:
      url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
      size: 17938799
      sha256: f872d837d3c90ed2e05227bed711af5671a6fd1c9f7d7e91c911a61f155e99da

# Roles in models.yaml -> upscalers; the active one is settings.yaml -> defaults.refiner.upscaler.

# ControlNets guide a render with the structure of an image the engine already made
# ("keep composition"). Active role: settings.yaml -> defaults.controlnet.model.
controlnets:
  canny:
    id: noob_sdxl_controlnet_canny.fp16.safetensors
    display: NoobAI-XL ControlNet canny (fp16), edges from ComfyUI's built-in Canny node
    source: https://huggingface.co/Eugeoter/noob-sdxl-controlnet-canny
    subdir: controlnet
    feature: keep composition (Regenerate)
    license: {name: FAIR AI Public License 1.0-SD, url: https://freedevproject.org/faipl-1.0-sd/}
    download:
      url: https://huggingface.co/Eugeoter/noob-sdxl-controlnet-canny/resolve/3c1b6e45cbd0df09368599c1d205be459a67c552/noob_sdxl_controlnet_canny.fp16.safetensors
      size: 2502139104
      sha256: e37bcdb2f4a6d1782daf6a943a326bee6e6d3027c34f6016460a2c937ba9fba0


# Image taggers judge renders in `manganation eval` (docs/eval.md); `manganation setup
# --eval` fetches them. Each names its tag list (`tags:`), like adapters name encoders.
taggers:
  wd_swinv2_v3:
    id: wd-swinv2-tagger-v3.onnx
    display: WD SwinV2 tagger v3 (Danbooru tags, ONNX, runs on the CPU)
    source: https://huggingface.co/SmilingWolf/wd-swinv2-tagger-v3
    tags: wd_swinv2_v3_tags
    subdir: taggers
    feature: render-accuracy eval (judge)
    license: {name: Apache-2.0, url: https://huggingface.co/SmilingWolf/wd-swinv2-tagger-v3}
    download:
      url: https://huggingface.co/SmilingWolf/wd-swinv2-tagger-v3/resolve/627aef95638667ddcaa3ac8ae625e88ea5b02f51/model.onnx
      size: 467460978
      sha256: e6774bff34d43bd49f75a47db4ef217dce701c9847b546523eb85ff6dbba1db1
  wd_swinv2_v3_tags:
    id: wd-swinv2-tagger-v3.csv
    display: WD SwinV2 tagger v3 tag list
    subdir: taggers
    feature: render-accuracy eval (tag names)
    license: {name: Apache-2.0, url: https://huggingface.co/SmilingWolf/wd-swinv2-tagger-v3}
    download:
      url: https://huggingface.co/SmilingWolf/wd-swinv2-tagger-v3/resolve/627aef95638667ddcaa3ac8ae625e88ea5b02f51/selected_tags.csv
