# Model registry.
# `id` is the filename ComfyUI expects under models/<subdir>/.
# Swap freely — the renderer references models by role, not path.
#
# `download` makes an entry fetchable by `manganation setup` (src/manganation/
# models_setup.py): `url` (pinned to a repo revision, so it never changes under us),
# optional `mirrors` tried in order, and the file's exact `size` and `sha256`, checked
# after every download and when linking a file the user already has. `license` is shown
# before downloading; `feature` says what the file enables.

checkpoints:
  primary:
    id: noobaiXL.safetensors
    display: NoobAI-XL (SDXL, anime/manga)
    source: https://huggingface.co/Laxhar/noobai-XL-1.1
    subdir: checkpoints
    feature: rendering (required)
    license: {name: FAIR AI Public License 1.0-SD, url: https://freedevproject.org/faipl-1.0-sd/}
    download:
      url: https://huggingface.co/Laxhar/noobai-XL-1.1/resolve/814a274af2b8097c0828819d561ec74c7d0c6cea/NoobAI-XL-v1.1.safetensors
      size: 7105349958
      sha256: 6681e8e4b134c81f16533acedb0d406d7e5e366e1624b4105178c64d00b05d51
  fallbacks:
    - id: illustriousXL.safetensors
      display: Illustrious-XL
      source: https://huggingface.co/OnomaAIResearch/Illustrious-XL-v1.1
      subdir: checkpoints
    - id: animagineXL40.safetensors
      display: Animagine XL 4.0
      source: https://huggingface.co/cagliostrolab/animagine-xl-4.0
      subdir: checkpoints

loras:
  color_style:
    id: color_style.safetensors
    display: Colour style LoRA (optional)
    subdir: loras
    trigger: ""

# Adapters name the CLIP-vision encoder they were trained with (`encoder:`); the
# active adapter is settings.yaml -> defaults.ipadapter.adapter.
ipadapter:
  noob_mark1:
    id: noobIPAMARK1_mark1.safetensors
    display: NoobAI IP-Adapter Mark 1 (trained on NoobAI-XL EPS v1.1; ViT-bigG)
    source: https://huggingface.co/r3gm/noob-ipa (model_G)
    encoder: clip_vision_g
    subdir: ipadapter
    feature: characters stay on-model (reference images)
    # Both are third-party mirrors of NoobAI's release; neither states a licence.
    license: {name: not stated by the mirrors (NoobAI release), url: https://huggingface.co/r3gm/noob-ipa}
    download:
      url: https://huggingface.co/r3gm/noob-ipa/resolve/534fdd8fb5a221d67937d5495febd2560a1d395e/model_G/noobIPAMARK1_mark1.safetensors
      mirrors:
        - https://huggingface.co/wtz37/sdxl/resolve/feced8eb63a67fd272fb768fafb8b5d7fb0a1403/noobIPAMARK1_mark1.safetensors
      size: 1405172056
      sha256: 5cdb6a00be1b12579745b5bed0c7b83f0869073d8a864fa8cd50a9356601919a
  plus:
    id: ip-adapter-plus_sdxl_vit-h.safetensors
    display: IP-Adapter Plus SDXL (ViT-H) - base SDXL; tiles/glows on NoobAI
    source: https://huggingface.co/h94/IP-Adapter
    encoder: clip_vision
    subdir: ipadapter
    feature: characters stay on-model (base-SDXL adapter, not recommended)
    license: {name: Apache-2.0, url: https://huggingface.co/h94/IP-Adapter}
    download:
      url: https://huggingface.co/h94/IP-Adapter/resolve/018e402774aeeddd60609b4ecdb7e298259dc729/sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
      size: 847517512
      sha256: 3f5062b8400c94b7159665b21ba5c62acdcd7682262743d7f2aefedef00e6581
  clip_vision:
