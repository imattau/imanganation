[project]
name = "imanganation"
version = "0.0.1"
description = "AI manga generation: script -> consistent, text-free colour panels, local via ComfyUI, placed into pages in GIMP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rich>=13.9",
    "typer>=0.12",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Ollama access is via HTTP, but keep a dev helper for local testing.
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "jsonschema>=4.23",
]

# `manganation eval`: the WD14 tagger that judges renders (CPU ONNX).
eval = [
    "onnxruntime>=1.18",
    "numpy>=1.26",
]

[project.scripts]
manganation = "manganation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manganation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer uses function calls as argument defaults by design (B008).
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." for gimp/imanganation (stdlib-only plug-in modules)
testpaths = ["tests"]
